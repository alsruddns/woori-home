# Include this snippet once inside the existing Portal virtual-host `server` block.
# Keep the separate `/api/` MoneyBook location unchanged.
location ^~ /portal-api/ {
    proxy_pass http://portal:3003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
