services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: woori_test_admin_local_only
    ports:
      - "127.0.0.1:${TEST_PG_PORT:-55432}:5432"
    volumes:
      - woori_portal_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  woori_portal_test_data:
    name: woori_portal_test_data
