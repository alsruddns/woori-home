name: Inspect production portal routing

on:
  workflow_dispatch:
    inputs:
      apply_portal_api_route:
        description: Back up Nginx config, route only /portal-api/ to Portal, validate, and reload Nginx
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  inspect-nginx:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Read Portal API routing from Nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          APPLY_PORTAL_API_ROUTE: ${{ inputs.apply_portal_api_route }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APPLY_PORTAL_API_ROUTE
          script: |
            set -Eeuo pipefail
            printf '[NGINX INSPECT] Reading active configuration without changes.\n'
            nginx_container="$(docker ps --format "{{.Names}}" | awk "tolower(\$0) ~ /nginx/ { print; exit }")"
            test -n "$nginx_container"
            docker exec "$nginx_container" nginx -t
            printf '[NGINX INSPECT] Nginx configuration mounts:\n'
            docker inspect --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}' "$nginx_container"
            mount_rw="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d"}}{{.RW}}{{end}}{{end}}' "$nginx_container")"
            printf '[NGINX INSPECT] Configuration mount writable=%s\n' "$mount_rw"
            host_config_dir=/opt/services/nginx/conf.d
            backup_dir=/opt/backups/woori-portal
            if config_candidates="$(grep -lF 'proxy_pass http://moneybook-backend:8080;' "$host_config_dir"/*.conf)"; then :; else config_candidates=""; fi
            candidate_count="$(printf '%s\n' "$config_candidates" | awk 'NF { count++ } END { print count + 0 }')"
            printf '[NGINX INSPECT] MoneyBook API config candidate count=%s\n' "$candidate_count"
            if [ "$candidate_count" = 1 ]; then
              target_host="$config_candidates"
              file_writable=false
              backup_writable=false
              [ -w "$target_host" ] && file_writable=true
              [ -d "$backup_dir" ] && [ -w "$backup_dir" ] && backup_writable=true
              printf '[NGINX INSPECT] Active config file=%s; deploy account file writable=%s; backup directory writable=%s\n' "$(basename "$target_host")" "$file_writable" "$backup_writable"
              target_container="/etc/nginx/conf.d/$(basename "$target_host")"
              if api_location_count="$(docker exec "$nginx_container" grep -Fc 'location ^~ /api/ {' "$target_container")"; then :; else api_location_count=0; fi
              printf '[NGINX INSPECT] Existing MoneyBook /api location count=%s\n' "$api_location_count"
              if docker exec "$nginx_container" grep -Fq 'location ^~ /portal-api/' "$target_container"; then
                printf '[NGINX INSPECT] Existing Portal API location present=true\n'
              else
                printf '[NGINX INSPECT] Existing Portal API location present=false\n'
              fi
            fi

            if [ "${APPLY_PORTAL_API_ROUTE:-false}" != true ]; then
              printf '[NGINX INSPECT] Read-only inspection complete; no configuration changed.\n'
              exit 0
            fi

            stage="Validate the isolated Portal API route target"
            printf '[NGINX APPLY 1] %s\n' "$stage"
            if [ "$candidate_count" != 1 ]; then
              printf '[NGINX APPLY BLOCKED] Expected exactly one config file with the existing MoneyBook API route.\n' >&2
              exit 2
            fi
            test -f "$target_host"
            test ! -L "$target_host"
            if [ "$file_writable" != true ] || [ "$backup_writable" != true ]; then
              printf '[NGINX APPLY BLOCKED] The deploy account cannot safely write the active config and existing backup directory.\n' >&2
              exit 2
            fi
            printf '[NGINX APPLY CHECK] Existing /api location count=%s\n' "$api_location_count"
            if [ "$api_location_count" != 1 ]; then
              printf '[NGINX APPLY BLOCKED] Expected exactly one /api location in the selected config.\n' >&2
              exit 2
            fi
            if docker exec "$nginx_container" grep -Fq 'location ^~ /portal-api/' "$target_container"; then
              printf '[NGINX APPLY ERROR] A /portal-api/ location already exists; refusing to change it.\n' >&2
              exit 1
            fi

            timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            backup="$backup_dir/nginx-$(basename "$target_host").portal-api-${timestamp}.bak"
            test ! -e "$backup"
            cp -p "$target_host" "$backup"
            before_sha="$(sha256sum "$target_host" | awk '{print $1}')"
            container_sha="$(docker exec "$nginx_container" sha256sum "$target_container" | awk '{print $1}')"
            test "$container_sha" = "$before_sha"
            modified=0
            on_exit() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ] && [ "$modified" = 1 ]; then
                printf '[NGINX ROLLBACK] Restoring the backed-up Nginx configuration.\n' >&2
                if cat "$backup" > "$target_host" && docker exec "$nginx_container" nginx -t && docker exec "$nginx_container" nginx -s reload; then
                  printf '[NGINX ROLLBACK] Previous configuration restored and reloaded.\n' >&2
                else
                  printf '[NGINX ROLLBACK ERROR] Automatic restoration failed; the saved backup remains at %s.\n' "$backup" >&2
                fi
              fi
              exit "$status"
            }
            trap on_exit EXIT

            stage="Add Portal-only API location"
            printf '[NGINX APPLY 2] %s\n' "$stage"
            modified=1
            python3 - "$target_host" "$before_sha" <<'REMOTE'
            import hashlib, pathlib, re, sys
            target = pathlib.Path(sys.argv[1])
            expected_sha = sys.argv[2]
            original = target.read_bytes()
            if hashlib.sha256(original).hexdigest() != expected_sha:
                raise SystemExit("Nginx config changed after preflight; refusing to overwrite it.")
            text = original.decode("utf-8")
            pattern = re.compile(r"(?m)^([ \t]*)location[ \t]+\^~[ \t]+/api/[ \t]*\{[ \t]*$")
            matches = list(pattern.finditer(text))
            if len(matches) != 1:
                raise SystemExit("Expected exactly one /api location in the selected Nginx config.")
            indent = matches[0].group(1)
            child = indent + "    "
            route = "\n".join([
                indent + "location ^~ /portal-api/ {",
                child + "proxy_pass http://portal:3003;",
                child + "proxy_set_header Host $host;",
                child + "proxy_set_header X-Real-IP $remote_addr;",
                child + "proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;",
                child + "proxy_set_header X-Forwarded-Proto $scheme;",
                indent + "}",
                "",
            ])
            offset = matches[0].start()
            updated = text[:offset] + route + text[offset:]
            with target.open("w", encoding="utf-8", newline="") as stream:
                stream.write(updated)

            REMOTE

            stage="Validate Nginx configuration before reload"
            printf '[NGINX APPLY 3] %s\n' "$stage"
            docker exec "$nginx_container" nginx -t

            stage="Reload Nginx without restarting other services"
            printf '[NGINX APPLY 4] %s\n' "$stage"
            docker exec "$nginx_container" nginx -s reload

            stage="Verify Portal API and preserve existing routes"
            printf '[NGINX APPLY 5] %s\n' "$stage"
            valid_body="$(curl --fail --silent --show-error --max-time 20 -H 'Accept: application/json' 'https://www.woori.today/portal-api/world-bank/compare?countries=kr%2Cus&indicator=unemployment')"
            case "$valid_body" in *'"source":"json"'*) ;; *) printf '[NGINX APPLY ERROR] The valid Portal API response did not confirm JSON mode.\n' >&2; exit 1 ;; esac
            invalid_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 -H 'Accept: application/json' 'https://www.woori.today/portal-api/world-bank/compare?countries=kr&indicator=unemployment')"
            test "$invalid_status" = 400
            method_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 -X POST -H 'Accept: application/json' -H 'Content-Type: application/json' --data '{}' 'https://www.woori.today/portal-api/world-bank/compare')"
            test "$method_status" = 405
            legacy_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 -H 'Accept: application/json' 'https://www.woori.today/api/data-compare?countries=kr%2Cus&indicator=unemployment')"
            test "$legacy_status" = 401
            portal_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 'https://www.woori.today/ko')"
            test "$portal_status" = 200
            after_sha="$(sha256sum "$target_host" | awk '{print $1}')"
            printf '[NGINX APPLY RESULT] Portal API 200/source=json; invalid request 400; unsupported method 405; existing /api route 401; Portal page 200.\n'
            printf '[NGINX APPLY CHANGE] backup_sha=%s active_sha=%s added_route=/portal-api/->portal:3003\n' "$before_sha" "$after_sha"
            printf '[NGINX APPLY BACKUP] %s\n' "$backup"
            modified=0
            docker exec "$nginx_container" nginx -T 2>/dev/null | python3 -c '
            import re, sys
            lines = sys.stdin.readlines()
            in_server = False
            server_depth = 0
            in_location = False
            location_depth = 0
            location_lines = []
            selected_server = False
            route_count = 0
            for line in lines:
                stripped = line.strip()
                if not in_server and re.match(r"server\s*\{", stripped):
                    in_server = True
                    server_depth = line.count("{") - line.count("}")
                    selected_server = False
                    continue
                if in_server:
                    server_depth += line.count("{") - line.count("}")
                    if re.search(r"\bserver_name\b.*(?:woori\.today|www\.woori\.today)", line):
                        selected_server = True
                    if re.match(r"location\b.*\{", stripped):
                        in_location = True
                        location_depth = line.count("{") - line.count("}")
                        location_lines = [line]
                        continue
                    if in_location:
                        location_lines.append(line)
                        location_depth += line.count("{") - line.count("}")
                        if location_depth <= 0:
                            block = "".join(location_lines)
                            if selected_server:
                                route_count += 1
                                print("[NGINX LOCATION] server_name=woori.today")
                                for item in location_lines:
                                    item = item.strip()
                                    if re.match(r"location\b", item) or re.match(r"(?:proxy_pass|fastcgi_pass|auth_request|return|try_files)\b", item):
                                        print(item)
                            in_location = False
                            location_lines = []
                    if server_depth <= 0:
                        in_server = False
                        in_location = False
            if route_count == 0:
                print("[NGINX INSPECT] No location blocks were found in the woori.today server block.")
            '
