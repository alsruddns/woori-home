name: Refresh NASA near-Earth object data

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/data/update-nasa-neows.mjs
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
      - name: Commit snapshot when data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/nasa-neows.json
          git diff --cached --quiet || { git commit -m "Update : [Data] Refresh NASA NEO snapshot" && git push origin develop; }
