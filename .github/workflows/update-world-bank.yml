name: Refresh World Bank data

on:
  schedule:
    - cron: "23 4 8 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-bank-refresh-develop
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: refresh
        run: node scripts/data/update-world-bank.mjs
        continue-on-error: true
      - name: Commit snapshot and batch status on develop
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/world-bank.json src/data/world-bank.status.json
          git diff --cached --quiet || { git commit -m "Update : [Data] Refresh World Bank snapshot" && git push origin develop; }
      - name: Mark failed collection
        if: steps.refresh.outcome == 'failure'
        run: exit 1
