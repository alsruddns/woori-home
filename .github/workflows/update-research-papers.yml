name: Refresh research paper metadata

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-metadata-refresh-develop
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/data/update-papers.mjs
      - name: Commit metadata only when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/research-papers.json
          git diff --cached --quiet || { git commit -m "Update : [Research] Refresh Crossref metadata" && git push origin develop; }
