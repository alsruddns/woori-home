name: Publish and deploy portal

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_database_changes:
        description: Apply production migrations and the reviewed World Bank import after backup
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require main release ref
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/deploy/release-guard.mjs

  image:
    needs: release-guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      portal_digest: ${{ steps.portal.outputs.digest }}
      tools_digest: ${{ steps.tools.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish portal image
        id: portal
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: NEXT_PUBLIC_GA_ID=G-ZJSJW06SCX
          tags: ghcr.io/alsruddns/woori-home:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish one-off DB tools image
        id: tools
        uses: docker/build-push-action@v6
        with:
          context: .
          target: db-tools
          push: true
          tags: ghcr.io/alsruddns/woori-home:db-tools-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: woori-home-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate immutable release references
        env:
          RELEASE_SHA: ${{ github.sha }}
          PORTAL_DIGEST: ${{ needs.image.outputs.portal_digest }}
          TOOLS_DIGEST: ${{ needs.image.outputs.tools_digest }}
        run: |
          node scripts/deploy/release-guard.mjs
          node --input-type=module -e 'import {assertCommitDigest,assertCommitShaTag} from "./scripts/deploy/release-guard.mjs"; assertCommitShaTag(process.env.RELEASE_SHA); assertCommitDigest(process.env.PORTAL_DIGEST); assertCommitDigest(process.env.TOOLS_DIGEST);'
      - name: Deploy only the portal service
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
          PORTAL_DIGEST: ${{ needs.image.outputs.portal_digest }}
          TOOLS_DIGEST: ${{ needs.image.outputs.tools_digest }}
          APPLY_DATABASE_CHANGES: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_database_changes || 'false' }}
          PRODUCTION_OPERATION_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_database_changes && secrets.PRODUCTION_OPERATION_APPROVAL || '' }}
          PRODUCTION_DB_ALLOWED_HOSTS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_database_changes && secrets.PRODUCTION_DB_ALLOWED_HOSTS || '' }}
          PORTAL_HEALTH_URL: ${{ vars.PORTAL_HEALTH_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: RELEASE_SHA,PORTAL_DIGEST,TOOLS_DIGEST,APPLY_DATABASE_CHANGES,PRODUCTION_OPERATION_APPROVAL,PRODUCTION_DB_ALLOWED_HOSTS,PORTAL_HEALTH_URL
          script: |
            set -Eeuo pipefail
            umask 077
            stage="Initialize deployment"
            deploy_started=0
            rollback_tag=""
            override=""
            approval_file=""

            on_exit() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                printf '[DEPLOY ERROR] Stage: %s, Exit code: %s\n' "$stage" "$status" >&2
                if [ "$deploy_started" = "1" ]; then
                  printf '[DEPLOY ROLLBACK] Restoring the previous Portal image.\n' >&2
                  printf 'services:\n  portal:\n    image: %s\n    environment:\n      DB_IMPORT_URL:\n      DB_MIGRATION_URL:\n      DB_MIGRATION_ALLOW_PRODUCTION:\n      PRODUCTION_OPERATION_APPROVAL:\n      PRODUCTION_BACKUP_REFERENCE:\n      PRODUCTION_BACKUP_CONFIRMED:\n' "$rollback_tag" > "$override"
                  if ! compose -f "$override" up -d --no-deps portal; then
                    printf '[DEPLOY ROLLBACK ERROR] Could not restore the previous Portal image.\n' >&2
                  else
                    rollback_healthy=false
                    for n in $(seq 1 24); do
                      if [ "$(docker inspect --format='{{.State.Health.Status}}' portal 2>/dev/null || true)" = healthy ]; then rollback_healthy=true; break; fi
                      sleep 5
                    done
                    if [ "$rollback_healthy" != true ]; then
                      printf '[DEPLOY ROLLBACK ERROR] Previous Portal image did not become healthy.\n' >&2
                    fi
                  fi
                fi
              fi
              if [ -n "$override" ] && ! rm -f "$override"; then
                printf '[DEPLOY CLEANUP ERROR] Could not remove the temporary Compose override.\n' >&2
              fi
              if [ -n "$approval_file" ] && ! rm -f "$approval_file"; then
                printf '[DEPLOY CLEANUP ERROR] Could not remove the temporary approval file.\n' >&2
              fi
              exit "$status"
            }
            trap on_exit EXIT

            stage="Validate release references and server inputs"
            printf '[DEPLOY 1] %s\n' "$stage"
            cd /opt/services/compose
            test -f .env.moneybook
            test -r .env.moneybook
            test -f .env.portal
            test -r .env.portal
            test -f docker-compose.yml
            test -r docker-compose.yml
            test -n "${PORTAL_HEALTH_URL:-}"
            printf '%s' "$RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
            printf '%s' "$PORTAL_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
            printf '%s' "$TOOLS_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
            compose() { docker compose --env-file .env.moneybook --env-file .env.portal -f docker-compose.yml "$@"; }
            override="$(mktemp /tmp/woori-portal.XXXXXX.yml)"

            stage="Validate Compose configuration"
            printf '[DEPLOY 2] %s\n' "$stage"
            printf 'services:\n  portal:\n    environment:\n      DB_IMPORT_URL:\n      DB_MIGRATION_URL:\n      DB_MIGRATION_ALLOW_PRODUCTION:\n      PRODUCTION_OPERATION_APPROVAL:\n      PRODUCTION_BACKUP_REFERENCE:\n      PRODUCTION_BACKUP_CONFIRMED:\n' > "$override"
            compose -f "$override" config --quiet
            config_json="$(compose -f "$override" config --format json)"

            stage="Validate Portal network assignments"
            printf '[DEPLOY 3.1] %s\n' "$stage"
            if printf '%s' "$config_json" | jq -e '.services.portal.networks | (keys | sort) == ["database","default"]' >/dev/null; then :; else
              check_status=$?
              printf '[DEPLOY CHECK FAILED] Portal networks must be exactly database and default.\n' >&2
              exit "$check_status"
            fi

            stage="Validate configured Portal image"
            printf '[DEPLOY 3.2] %s\n' "$stage"
            if printf '%s' "$config_json" | jq -e '.services.portal.image | type == "string"' >/dev/null; then :; else
              check_status=$?
              printf '[DEPLOY CHECK FAILED] Portal image is not configured as a string.\n' >&2
              exit "$check_status"
            fi

            stage="Validate Portal runtime database URL source"
            printf '[DEPLOY 3.3] %s\n' "$stage"
            if printf '%s' "$config_json" | jq -e '(.services.portal.environment // {}) as $env | (($env.DATABASE_URL | type) == "string") or ((.services.portal.env_file // []) | map(if type == "string" then . else .path end) | any(endswith(".env.portal")))' >/dev/null; then :; else
              check_status=$?
              printf '[DEPLOY CHECK FAILED] Portal has no DATABASE_URL environment value or .env.portal env_file.\n' >&2
              exit "$check_status"
            fi

            stage="Block privileged database variables in Portal runtime"
            printf '[DEPLOY 3.4] %s\n' "$stage"
            if printf '%s' "$config_json" | jq -e '(.services.portal.environment // {}) as $env | ["DB_IMPORT_URL","DB_MIGRATION_URL","DB_MIGRATION_ALLOW_PRODUCTION","PRODUCTION_OPERATION_APPROVAL","PRODUCTION_BACKUP_REFERENCE","PRODUCTION_BACKUP_CONFIRMED"] | all(. as $key | $env[$key] == null)' >/dev/null; then :; else
              check_status=$?
              printf '[DEPLOY CHECK FAILED] Privileged DB variables remain in Portal runtime environment.\n' >&2
              exit "$check_status"
            fi

            stage="Verify current Portal and create a database backup"
            printf '[DEPLOY 4] %s\n' "$stage"
            current_health="$(docker inspect --format='{{.State.Health.Status}}' portal)"
            test "$current_health" = healthy
            curl --fail --silent --show-error --max-time 15 "$PORTAL_HEALTH_URL" >/dev/null
            before_entry="$(find /opt/backups/woori-portal -maxdepth 1 -type f -printf '%T@ %p\n' | sort -nr | sed -n '1p')"
            if /usr/local/bin/backup-woori-portal.sh >/dev/null 2>&1; then
              :
            else
              backup_status=$?
              printf '[DEPLOY ERROR] Backup command failed with exit code: %s\n' "$backup_status" >&2
              exit "$backup_status"
            fi
            after_entry="$(find /opt/backups/woori-portal -maxdepth 1 -type f -printf '%T@ %p\n' | sort -nr | sed -n '1p')"
            after="${after_entry#* }"
            after_time="${after_entry%% *}"
            test -n "$after" && test -s "$after"
            if [ "$after" = "${before_entry#* }" ] && [ "$after_time" = "${before_entry%% *}" ]; then echo "Backup file did not change." >&2; exit 1; fi
            backup_reference="$(basename "$after")"

            if [ "$APPLY_DATABASE_CHANGES" = "true" ]; then
              test -n "${PRODUCTION_OPERATION_APPROVAL:-}"
              test -n "${PRODUCTION_DB_ALLOWED_HOSTS:-}"
              approval_file="$(mktemp /tmp/woori-db-approval.XXXXXX)"
              printf '%s' "$PRODUCTION_OPERATION_APPROVAL" > "$approval_file"
              unset PRODUCTION_OPERATION_APPROVAL
              docker pull "ghcr.io/alsruddns/woori-home@${TOOLS_DIGEST}"
              db_tools_run() {
                docker run --rm --network compose_database \
                  --mount type=bind,src=/opt/services/compose/.env.portal,dst=/app/.portal.env,readonly \
                  --mount "type=bind,src=$approval_file,dst=/app/.production-approval,readonly" \
                  -e GITHUB_ACTIONS=true -e GITHUB_REF=refs/heads/main -e DB_TARGET=production \
                  -e PRODUCTION_OPERATION_APPROVAL_FILE=/app/.production-approval -e PRODUCTION_DB_ALLOWED_HOSTS \
                  -e PRODUCTION_BACKUP_CONFIRMED=true -e "PRODUCTION_BACKUP_REFERENCE=$backup_reference" \
                  "ghcr.io/alsruddns/woori-home@${TOOLS_DIGEST}" scripts/deploy/run-production-db-tool.mjs /app/.portal.env "$@"
              }
              stage="Preflight approved production database operation"
              printf '[DEPLOY DB] %s\n' "$stage"
              db_tools_run scripts/db/preflight-production.mjs
              stage="Check production database migration status"
              printf '[DEPLOY DB] %s\n' "$stage"
              db_tools_run scripts/db/status-production.mjs
              stage="Dry-run approved World Bank import"
              printf '[DEPLOY DB] %s\n' "$stage"
              db_tools_run scripts/data/import-world-bank-production.mjs --dry-run
              stage="Apply production database migrations"
              printf '[DEPLOY DB] %s\n' "$stage"
              db_tools_run scripts/db/migrate-production.mjs --apply --backup-reference="$backup_reference"
              stage="Verify production database migration status"
              printf '[DEPLOY DB] %s\n' "$stage"
              db_tools_run scripts/db/status-production.mjs
              stage="Import approved World Bank observations"
              printf '[DEPLOY DB] %s\n' "$stage"
              db_tools_run scripts/data/import-world-bank-production.mjs --apply --backup-reference="$backup_reference"
              stage="Verify production World Bank import"
              printf '[DEPLOY DB] %s\n' "$stage"
              db_tools_run scripts/data/verify-world-bank-production.mjs
            fi

            stage="Validate GHCR image access"
            printf '[DEPLOY 5] %s\n' "$stage"
            docker pull "ghcr.io/alsruddns/woori-home@${PORTAL_DIGEST}"

            stage="Preserve rollback image"
            printf '[DEPLOY 6] %s\n' "$stage"
            old_image_id="$(docker inspect --format='{{.Image}}' portal)"
            rollback_tag="ghcr.io/alsruddns/woori-home:rollback-${old_image_id#sha256:}"
            docker tag "$old_image_id" "$rollback_tag"
            printf 'services:\n  portal:\n    image: ghcr.io/alsruddns/woori-home@%s\n    environment:\n      DB_IMPORT_URL:\n      DB_MIGRATION_URL:\n      DB_MIGRATION_ALLOW_PRODUCTION:\n      PRODUCTION_OPERATION_APPROVAL:\n      PRODUCTION_BACKUP_REFERENCE:\n      PRODUCTION_BACKUP_CONFIRMED:\n' "$PORTAL_DIGEST" > "$override"
            compose -f "$override" config --quiet

            stage="Deploy Portal image"
            printf '[DEPLOY 7] %s\n' "$stage"
            deploy_started=1
            compose -f "$override" up -d --no-deps portal

            stage="Wait for Portal Healthcheck"
            printf '[DEPLOY 8] %s\n' "$stage"
            healthy=false
            for n in $(seq 1 24); do
              if [ "$(docker inspect --format='{{.State.Health.Status}}' portal 2>/dev/null || true)" = healthy ]; then healthy=true; break; fi
              sleep 5
            done
            test "$healthy" = true

            stage="HTTP smoke test"
            printf '[DEPLOY 9] %s\n' "$stage"
            curl --fail --silent --show-error --max-time 15 "$PORTAL_HEALTH_URL" >/dev/null
            deploy_started=0
            echo "Portal deployed from commit ${RELEASE_SHA}; image digest ${PORTAL_DIGEST}; rollback tag ${rollback_tag} retained."
