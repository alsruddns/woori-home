name: Publish and deploy portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/alsruddns/woori-home
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_GA_ID=G-ZJSJW06SCX
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy portal
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            cd /opt/services/compose

            docker compose --env-file .env.moneybook pull portal
            docker compose --env-file .env.moneybook up -d portal

            echo "Waiting for portal health..."

            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' portal 2>/dev/null || true)

              if [ "$STATUS" = "healthy" ]; then
                echo "Portal is healthy"
                docker ps --filter name=portal
                exit 0
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "Portal is unhealthy"
                docker logs --tail 100 portal
                exit 1
              fi

              echo "Current health: ${STATUS:-starting} ($i/24)"
              sleep 5
            done

            echo "Portal health check timed out"
            docker logs --tail 100 portal
            exit 1
