name: Publish and deploy portal

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_portal:
        description: Deploy the Portal image and run Portal HTTP checks
        type: boolean
        required: true
        default: false
      preflight_database:
        description: Run read-only production DB and SEC schema preflight
        type: boolean
        required: true
        default: false
      apply_migrations:
        description: Apply pending Portal migrations after approved backup validation
        type: boolean
        required: true
        default: false
      import_world_bank:
        description: Import and verify the reviewed World Bank snapshot
        type: boolean
        required: true
        default: false
      import_sec:
        description: Collect, import, and verify SEC Company Facts
        type: boolean
        required: true
        default: false
      confirm_production_db_write:
        description: Explicitly approve the selected production database write for this run
        type: boolean
        required: true
        default: false
      restore_validation_reference:
        description: Reference to the separately verified isolated restore procedure (required for DB writes)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require main release ref
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/deploy/release-guard.mjs

  image:
    needs: release-guard
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[db-first]')) && (github.event_name == 'push' || inputs.deploy_portal || inputs.preflight_database || inputs.apply_migrations || inputs.import_world_bank || inputs.import_sec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      portal_digest: ${{ steps.portal.outputs.digest }}
      tools_digest: ${{ steps.tools.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish portal image
        id: portal
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          build-args: NEXT_PUBLIC_GA_ID=G-ZJSJW06SCX
          tags: ghcr.io/alsruddns/woori-home:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and publish one-off DB tools image
        id: tools
        uses: docker/build-push-action@v6
        with:
          context: .
          target: db-tools
          push: true
          tags: ghcr.io/alsruddns/woori-home:db-tools-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[db-first]')) && (github.event_name == 'push' || inputs.deploy_portal || inputs.preflight_database || inputs.apply_migrations || inputs.import_world_bank || inputs.import_sec)
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: woori-home-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate immutable release references
        env:
          RELEASE_SHA: ${{ github.sha }}
          PORTAL_DIGEST: ${{ needs.image.outputs.portal_digest }}
          TOOLS_DIGEST: ${{ needs.image.outputs.tools_digest }}
        run: |
          node scripts/deploy/release-guard.mjs
          node --input-type=module -e 'import {assertCommitDigest,assertCommitShaTag} from "./scripts/deploy/release-guard.mjs"; assertCommitShaTag(process.env.RELEASE_SHA); assertCommitDigest(process.env.PORTAL_DIGEST); assertCommitDigest(process.env.TOOLS_DIGEST);'
      - name: Deploy only the portal service
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_SHA: ${{ github.sha }}
          PORTAL_DIGEST: ${{ needs.image.outputs.portal_digest }}
          TOOLS_DIGEST: ${{ needs.image.outputs.tools_digest }}
          DEPLOY_PORTAL: ${{ github.event_name == 'push' || inputs.deploy_portal }}
          PREFLIGHT_DATABASE: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_database || 'false' }}
          APPLY_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_migrations || 'false' }}
          IMPORT_WORLD_BANK: ${{ github.event_name == 'workflow_dispatch' && inputs.import_world_bank || 'false' }}
          IMPORT_SEC: ${{ github.event_name == 'workflow_dispatch' && inputs.import_sec || 'false' }}
          CONFIRM_PRODUCTION_DB_WRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production_db_write || 'false' }}
          RESTORE_VALIDATION_REFERENCE: ${{ inputs.restore_validation_reference || '' }}
          EXPECTED_RESTORE_VALIDATION_REFERENCE: ${{ vars.PRODUCTION_RESTORE_VALIDATION_REFERENCE }}
          PRODUCTION_OPERATION_APPROVAL: ${{ github.event_name == 'workflow_dispatch' && (inputs.preflight_database || inputs.apply_migrations || inputs.import_world_bank || inputs.import_sec) && secrets.PRODUCTION_OPERATION_APPROVAL || '' }}
          PRODUCTION_DB_ALLOWED_HOSTS: ${{ secrets.PRODUCTION_DB_ALLOWED_HOSTS }}
          PORTAL_HEALTH_URL: ${{ vars.PORTAL_HEALTH_URL }}
          SEC_EDGAR_USER_AGENT: ${{ github.event_name == 'workflow_dispatch' && inputs.import_sec && secrets.SEC_EDGAR_USER_AGENT || '' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: RELEASE_SHA,PORTAL_DIGEST,TOOLS_DIGEST,DEPLOY_PORTAL,PREFLIGHT_DATABASE,APPLY_MIGRATIONS,IMPORT_WORLD_BANK,IMPORT_SEC,CONFIRM_PRODUCTION_DB_WRITE,RESTORE_VALIDATION_REFERENCE,EXPECTED_RESTORE_VALIDATION_REFERENCE,PRODUCTION_OPERATION_APPROVAL,PRODUCTION_DB_ALLOWED_HOSTS,PORTAL_HEALTH_URL,SEC_EDGAR_USER_AGENT
          script: |
            set -Eeuo pipefail
            umask 077
            stage="Initialize deployment"
            deploy_started=0
            rollback_tag=""
            override=""
            approval_file=""
            smoke_body=""
            smoke_headers=""
            backup_reference=""
            database_write_requested=false
            database_operation_requested=false
            operation_count=0
            for selected in "$DEPLOY_PORTAL" "$PREFLIGHT_DATABASE" "$APPLY_MIGRATIONS" "$IMPORT_WORLD_BANK" "$IMPORT_SEC"; do
              case "$selected" in true) operation_count=$((operation_count + 1));; false) :;; *) echo "Invalid operation selector." >&2; exit 2;; esac
            done
            if [ "$operation_count" -gt 1 ]; then
              echo "Select one operation per protected run; each result and approval must remain independent." >&2
              exit 2
            fi
            [ "$PREFLIGHT_DATABASE" = "true" ] && database_operation_requested=true
            [ "$APPLY_MIGRATIONS" = "true" ] && database_write_requested=true && database_operation_requested=true
            [ "$IMPORT_WORLD_BANK" = "true" ] && database_write_requested=true && database_operation_requested=true
            [ "$IMPORT_SEC" = "true" ] && database_write_requested=true && database_operation_requested=true
            if [ "$database_write_requested" = "true" ] && [ "$CONFIRM_PRODUCTION_DB_WRITE" != "true" ]; then
              echo "Production database writes require the explicit confirm_production_db_write input." >&2
              exit 2
            fi

            on_exit() {
              status=$?
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                printf '[DEPLOY ERROR] Stage: %s, Exit code: %s\n' "$stage" "$status" >&2
                if [ "$deploy_started" = "1" ]; then
                  printf '[DEPLOY ROLLBACK] Restoring the previous Portal image.\n' >&2
                  printf 'services:\n  portal:\n    image: %s\n    environment:\n      DB_IMPORT_URL: ""\n      DB_MIGRATION_URL: ""\n      DB_MIGRATION_ALLOW_PRODUCTION: ""\n      PRODUCTION_OPERATION_APPROVAL: ""\n      PRODUCTION_BACKUP_REFERENCE: ""\n      PRODUCTION_BACKUP_CONFIRMED: ""\n' "$rollback_tag" > "$override"
                  if ! compose -f "$override" up -d --no-deps portal; then
                    printf '[DEPLOY ROLLBACK ERROR] Could not restore the previous Portal image.\n' >&2
                  else
                    rollback_healthy=false
                    for n in $(seq 1 24); do
                      if [ "$(docker inspect --format='{{.State.Health.Status}}' portal 2>/dev/null || true)" = healthy ]; then rollback_healthy=true; break; fi
                      sleep 5
                    done
                    if [ "$rollback_healthy" != true ]; then
                      printf '[DEPLOY ROLLBACK ERROR] Previous Portal image did not become healthy.\n' >&2
                    fi
                  fi
                fi
              fi
              if [ -n "$override" ] && ! rm -f "$override"; then
                printf '[DEPLOY CLEANUP ERROR] Could not remove the temporary Compose override.\n' >&2
              fi
              if [ -n "$approval_file" ] && ! rm -f "$approval_file"; then
                printf '[DEPLOY CLEANUP ERROR] Could not remove the temporary approval file.\n' >&2
              fi
              if [ -n "$smoke_body" ] && ! rm -f "$smoke_body"; then
                printf '[DEPLOY CLEANUP ERROR] Could not remove the temporary smoke-test body.\n' >&2
              fi
              if [ -n "$smoke_headers" ] && ! rm -f "$smoke_headers"; then
                printf '[DEPLOY CLEANUP ERROR] Could not remove the temporary smoke-test headers.\n' >&2
              fi
              exit "$status"
            }
            trap on_exit EXIT

            stage="Validate release references and server inputs"
            printf '[DEPLOY 1] %s\n' "$stage"
            cd /opt/services/compose
            test -f .env.moneybook
            test -r .env.moneybook
            test -f .env.portal
            test -r .env.portal
            test -f docker-compose.yml
            test -r docker-compose.yml
            test -n "${PORTAL_HEALTH_URL:-}"
            printf '%s' "$RELEASE_SHA" | grep -Eq '^[a-f0-9]{40}$'
            printf '%s' "$PORTAL_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
            printf '%s' "$TOOLS_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
            compose() { docker compose --env-file .env.moneybook --env-file .env.portal -f docker-compose.yml "$@"; }
            override="$(mktemp /tmp/woori-portal.XXXXXX.yml)"

            stage="Validate Compose configuration"
            printf '[DEPLOY 2] %s\n' "$stage"
            printf 'services:\n  portal:\n    environment:\n      DB_IMPORT_URL: ""\n      DB_MIGRATION_URL: ""\n      DB_MIGRATION_ALLOW_PRODUCTION: ""\n      PRODUCTION_OPERATION_APPROVAL: ""\n      PRODUCTION_BACKUP_REFERENCE: ""\n      PRODUCTION_BACKUP_CONFIRMED: ""\n' > "$override"
            compose -f "$override" config --quiet
            config_json="$(compose -f "$override" config --format json)"

            stage="Validate Portal network assignments"
            printf '[DEPLOY 3.1] %s\n' "$stage"
            if printf '%s' "$config_json" | jq -e '.services.portal.networks | (keys | sort) == ["database","default"]' >/dev/null; then :; else
              check_status=$?
              printf '[DEPLOY CHECK FAILED] Portal networks must be exactly database and default.\n' >&2
              exit "$check_status"
            fi

            stage="Validate configured Portal image"
            printf '[DEPLOY 3.2] %s\n' "$stage"
            if printf '%s' "$config_json" | jq -e '.services.portal.image | type == "string"' >/dev/null; then :; else
              check_status=$?
              printf '[DEPLOY CHECK FAILED] Portal image is not configured as a string.\n' >&2
              exit "$check_status"
            fi

            stage="Validate Portal runtime database URL source"
            printf '[DEPLOY 3.3] %s\n' "$stage"
            if printf '%s' "$config_json" | jq -e '(.services.portal.environment // {}) as $env | (($env.DATABASE_URL | type) == "string") or ((.services.portal.env_file // []) | map(if type == "string" then . else .path end) | any(endswith(".env.portal")))' >/dev/null; then :; else
              check_status=$?
              printf '[DEPLOY CHECK FAILED] Portal has no DATABASE_URL environment value or .env.portal env_file.\n' >&2
              exit "$check_status"
            fi

            stage="Block privileged database variables in Portal runtime"
            printf '[DEPLOY 3.4] %s\n' "$stage"
            remaining_privileged_keys="$(printf '%s' "$config_json" | jq -r '(.services.portal.environment // {}) as $env | ["DB_IMPORT_URL","DB_MIGRATION_URL","DB_MIGRATION_ALLOW_PRODUCTION","PRODUCTION_OPERATION_APPROVAL","PRODUCTION_BACKUP_REFERENCE","PRODUCTION_BACKUP_CONFIRMED"] | map(select($env[.] != null and $env[.] != "")) | join(",")')"
            if [ -n "$remaining_privileged_keys" ]; then
              printf '[DEPLOY CHECK FAILED] Non-empty privileged DB keys remain in Portal runtime: %s\n' "$remaining_privileged_keys" >&2
              exit 1
            fi

            if [ "$database_operation_requested" = "true" ]; then
              test -n "${PRODUCTION_OPERATION_APPROVAL:-}"
              test -n "${PRODUCTION_DB_ALLOWED_HOSTS:-}"
              approval_file="$(mktemp /tmp/woori-db-approval.XXXXXX)"
              printf '%s' "$PRODUCTION_OPERATION_APPROVAL" > "$approval_file"
              unset PRODUCTION_OPERATION_APPROVAL
              docker pull "ghcr.io/alsruddns/woori-home@${TOOLS_DIGEST}"
              db_tools_run() {
                docker run --rm --network compose_database \
                  --mount type=bind,src=/opt/services/compose/.env.portal,dst=/app/.portal.env,readonly \
                  --mount "type=bind,src=$approval_file,dst=/app/.production-approval,readonly" \
                  -e GITHUB_ACTIONS=true -e GITHUB_REF=refs/heads/main -e DB_TARGET=production \
                  -e PRODUCTION_OPERATION_APPROVAL_FILE=/app/.production-approval -e PRODUCTION_DB_ALLOWED_HOSTS \
                  -e PRODUCTION_BACKUP_CONFIRMED="${backup_reference:+true}" -e "PRODUCTION_BACKUP_REFERENCE=$backup_reference" \
                  -e SEC_EDGAR_USER_AGENT \
                  "ghcr.io/alsruddns/woori-home@${TOOLS_DIGEST}" scripts/deploy/run-production-db-tool.mjs /app/.portal.env "$@"
              }
              sec_tools_run() {
                local external_network container_name run_status
                external_network="$(docker inspect --format='{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' portal | grep -vx compose_database | head -n 1)"
                test -n "$external_network"
                container_name="woori-sec-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                docker create --name "$container_name" --network compose_database \
                  --mount type=bind,src=/opt/services/compose/.env.portal,dst=/app/.portal.env,readonly \
                  --mount "type=bind,src=$approval_file,dst=/app/.production-approval,readonly" \
                  -e GITHUB_ACTIONS=true -e GITHUB_REF=refs/heads/main -e DB_TARGET=production \
                  -e PRODUCTION_OPERATION_APPROVAL_FILE=/app/.production-approval -e PRODUCTION_DB_ALLOWED_HOSTS \
                  -e PRODUCTION_BACKUP_CONFIRMED="${backup_reference:+true}" -e "PRODUCTION_BACKUP_REFERENCE=$backup_reference" \
                  -e SEC_EDGAR_USER_AGENT \
                  "ghcr.io/alsruddns/woori-home@${TOOLS_DIGEST}" scripts/data/import-sec-company-facts-production.mjs "$@" >/dev/null
                docker network connect "$external_network" "$container_name"
                if docker start --attach "$container_name"; then run_status=0; else run_status=$?; fi
                docker rm "$container_name" >/dev/null
                return "$run_status"
              }
              validate_backup_archive() {
                docker run --rm \
                  --mount "type=bind,src=$1,dst=/tmp/production.dump,readonly" \
                  --entrypoint pg_restore \
                  "ghcr.io/alsruddns/woori-home@${TOOLS_DIGEST}" --list /tmp/production.dump >/dev/null
              }
              stage="Preflight approved production database operation"
              printf '[DEPLOY DB] %s\n' "$stage"
              db_tools_run scripts/db/preflight-production.mjs
              preflight_args=""
              if [ "$APPLY_MIGRATIONS" = "true" ] || [ "$IMPORT_SEC" = "true" ]; then preflight_args="--allow-pending-sec-grants"; fi
              preflight_report="$(db_tools_run scripts/db/preflight-financial-production.mjs $preflight_args)"
              printf '%s\n' "$preflight_report" | jq -e '.blockers | length == 0' >/dev/null
              if [ "$IMPORT_SEC" = "true" ] && [ "$APPLY_MIGRATIONS" != "true" ]; then
                printf '%s\n' "$preflight_report" | jq -e '.migrations.applied == 6' >/dev/null
              fi
              stage="Check production database migration status"
              printf '[DEPLOY DB] %s\n' "$stage"
              db_tools_run scripts/db/status-production.mjs
              if [ "$database_write_requested" = "true" ]; then
                test -n "$RESTORE_VALIDATION_REFERENCE"
                test "$RESTORE_VALIDATION_REFERENCE" = "$EXPECTED_RESTORE_VALIDATION_REFERENCE"
                [[ "$RESTORE_VALIDATION_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._/:+-]{2,255}$ ]]
                stage="Check current Portal container health"
                current_health="$(docker inspect --format='{{.State.Health.Status}}' portal)"
                printf '[DEPLOY DB CHECK] Current Portal container health: %s\n' "$current_health"
                test "$current_health" = healthy
                stage="Check current Portal HTTP health URL"
                if curl --fail --silent --show-error --max-time 15 "$PORTAL_HEALTH_URL" >/dev/null; then
                  printf '[DEPLOY DB CHECK] Portal health URL returned a successful response.\n'
                else
                  printf '[DEPLOY DB CHECK FAILED] Portal health URL did not return a successful response.\n' >&2
                  exit 1
                fi
                stage="Check production backup disk capacity"
                backup_size="$(printf '%s' "$preflight_report" | jq -er '.databaseSizeBytes | tonumber')"
                available_kb="$(df -Pk /opt/backups/woori-portal | awk 'NR==2 {print $4}')"
                test -n "$available_kb"
                printf '[DEPLOY DB CHECK] Required DB size bytes: %s; available backup space KiB: %s\n' "$backup_size" "$available_kb"
                test "$available_kb" -ge "$(( (backup_size + 1023) / 1024 ))"
                stage="Check PostgreSQL archive validation tool"
                docker run --rm --entrypoint pg_restore "ghcr.io/alsruddns/woori-home@${TOOLS_DIGEST}" --version >/dev/null
                stage="Create fresh pre-write database backup"
                printf '[DEPLOY DB] %s\n' "$stage"
                before_entry="$(find /opt/backups/woori-portal -maxdepth 1 -type f -printf '%T@ %p\n' | sort -nr | sed -n '1p')"
                if /usr/local/bin/backup-woori-portal.sh >/dev/null 2>&1; then :; else
                  backup_status=$?
                  printf '[DEPLOY ERROR] Backup command failed with exit code: %s\n' "$backup_status" >&2
                  exit "$backup_status"
                fi
                after_entry="$(find /opt/backups/woori-portal -maxdepth 1 -type f -printf '%T@ %p\n' | sort -nr | sed -n '1p')"
                after="${after_entry#* }"
                after_time="${after_entry%% *}"
                test -n "$after" && test -s "$after"
                if [ "$after" = "${before_entry#* }" ] && [ "$after_time" = "${before_entry%% *}" ]; then echo "Backup file did not change." >&2; exit 1; fi
                chmod 600 "$after"
                stage="Validate fresh production backup archive"
                validate_backup_archive "$after"
                sha256sum "$after" > "$after.sha256"
                chmod 600 "$after.sha256"
                sha256sum --check "$after.sha256" >/dev/null
                backup_reference="$(basename "$after")"
              fi
              if [ "$APPLY_MIGRATIONS" = "true" ]; then
                stage="Apply approved production migrations"
                db_tools_run scripts/db/migrate-production.mjs --apply --backup-reference="$backup_reference"
                stage="Verify migration status after migration"
                migration_status="$(db_tools_run scripts/db/status-production.mjs)"
                printf '%s\n' "$migration_status"
                printf '%s\n' "$migration_status" | grep -Eq '6 applied, 0 pending'
                stage="Grant and verify Runtime SELECT-only access to SEC tables"
                db_tools_run scripts/db/grant-financial-runtime-read-production.mjs --apply --backup-reference="$backup_reference"
                stage="Grant and verify restricted SEC Import access"
                db_tools_run scripts/db/grant-financial-import-production.mjs --apply --backup-reference="$backup_reference"
                stage="Recheck production schema and SEC grants"
                verified_preflight="$(db_tools_run scripts/db/preflight-financial-production.mjs)"
                printf '%s\n' "$verified_preflight" | jq -e '(.blockers | length) == 0 and (.permissionFindings | length) == 0' >/dev/null
              fi
              if [ "$IMPORT_WORLD_BANK" = "true" ]; then
                stage="Dry-run World Bank import"
                db_tools_run scripts/data/import-world-bank-production.mjs --dry-run
                stage="Import selected World Bank snapshot"
                db_tools_run scripts/data/import-world-bank-production.mjs --apply --backup-reference="$backup_reference"
                stage="Verify World Bank import"
                db_tools_run scripts/data/verify-world-bank-production.mjs
              fi
              if [ "$IMPORT_SEC" = "true" ]; then
                test -n "${SEC_EDGAR_USER_AGENT:-}"
                if [ "$APPLY_MIGRATIONS" != "true" ]; then
                  stage="Grant and verify Runtime SELECT-only access to SEC tables"
                  db_tools_run scripts/db/grant-financial-runtime-read-production.mjs --apply --backup-reference="$backup_reference"
                  stage="Grant and verify restricted SEC Import access"
                  db_tools_run scripts/db/grant-financial-import-production.mjs --apply --backup-reference="$backup_reference"
                  stage="Recheck production schema and SEC grants"
                  verified_preflight="$(db_tools_run scripts/db/preflight-financial-production.mjs)"
                  printf '%s\n' "$verified_preflight" | jq -e '(.blockers | length) == 0 and (.permissionFindings | length) == 0' >/dev/null
                fi
                stage="Inspect SEC production schema and Runtime grants before import"
                db_tools_run scripts/data/financial-sec-production.mjs status
                stage="Collect SEC facts and validate production dry run"
                sec_tools_run --dry-run
                stage="Import SEC Company Facts"
                sec_tools_run --apply --backup-reference="$backup_reference"
                stage="Verify SEC Company Facts after import"
                db_tools_run scripts/data/financial-sec-production.mjs verify
              fi
            fi

            if [ "$DEPLOY_PORTAL" = "true" ]; then
            if [ -z "$backup_reference" ]; then
              stage="Verify current Portal and create deployment backup"
              current_health="$(docker inspect --format='{{.State.Health.Status}}' portal)"
              test "$current_health" = healthy
              curl --fail --silent --show-error --max-time 15 "$PORTAL_HEALTH_URL" >/dev/null
              before_entry="$(find /opt/backups/woori-portal -maxdepth 1 -type f -printf '%T@ %p\n' | sort -nr | sed -n '1p')"
              /usr/local/bin/backup-woori-portal.sh >/dev/null 2>&1
              after_entry="$(find /opt/backups/woori-portal -maxdepth 1 -type f -printf '%T@ %p\n' | sort -nr | sed -n '1p')"
              after="${after_entry#* }"
              test -n "$after" && test -s "$after"
              if [ "$after" = "${before_entry#* }" ] && [ "${after_entry%% *}" = "${before_entry%% *}" ]; then echo "Backup file did not change." >&2; exit 1; fi
              chmod 600 "$after"
              docker run --rm --entrypoint pg_restore "ghcr.io/alsruddns/woori-home@${TOOLS_DIGEST}" --version >/dev/null
              docker run --rm --mount "type=bind,src=$after,dst=/tmp/production.dump,readonly" --entrypoint pg_restore "ghcr.io/alsruddns/woori-home@${TOOLS_DIGEST}" --list /tmp/production.dump >/dev/null
              sha256sum "$after" > "$after.sha256"
              chmod 600 "$after.sha256"
              sha256sum --check "$after.sha256" >/dev/null
              backup_reference="$(basename "$after")"
            fi
            stage="Validate GHCR image access"
            printf '[DEPLOY 5] %s\n' "$stage"
            docker pull "ghcr.io/alsruddns/woori-home@${PORTAL_DIGEST}"

            stage="Preserve rollback image"
            printf '[DEPLOY 6] %s\n' "$stage"
            old_image_id="$(docker inspect --format='{{.Image}}' portal)"
            rollback_tag="ghcr.io/alsruddns/woori-home:rollback-${old_image_id#sha256:}"
            docker tag "$old_image_id" "$rollback_tag"
            printf 'services:\n  portal:\n    image: ghcr.io/alsruddns/woori-home@%s\n    environment:\n      DB_IMPORT_URL: ""\n      DB_MIGRATION_URL: ""\n      DB_MIGRATION_ALLOW_PRODUCTION: ""\n      PRODUCTION_OPERATION_APPROVAL: ""\n      PRODUCTION_BACKUP_REFERENCE: ""\n      PRODUCTION_BACKUP_CONFIRMED: ""\n' "$PORTAL_DIGEST" > "$override"
            compose -f "$override" config --quiet

            stage="Deploy Portal image"
            printf '[DEPLOY 7] %s\n' "$stage"
            deploy_started=1
            compose -f "$override" up -d --no-deps portal

            stage="Wait for Portal Healthcheck"
            printf '[DEPLOY 8] %s\n' "$stage"
            healthy=false
            for n in $(seq 1 24); do
              if [ "$(docker inspect --format='{{.State.Health.Status}}' portal 2>/dev/null || true)" = healthy ]; then healthy=true; break; fi
              sleep 5
            done
            test "$healthy" = true

            stage="HTTP smoke test"
            printf '[DEPLOY 9] %s\n' "$stage"
            curl --fail --silent --show-error --max-time 15 "$PORTAL_HEALTH_URL" >/dev/null
            smoke_body="$(mktemp /tmp/woori-portal-smoke-body.XXXXXX)"
            smoke_headers="$(mktemp /tmp/woori-portal-smoke-headers.XXXXXX)"
            curl --fail --silent --show-error --max-time 20 --dump-header "$smoke_headers" --output "$smoke_body" 'https://www.woori.today/portal-api/world-bank/compare?countries=kr%2Cus&indicator=unemployment'
            jq -e '.source == "db" and .indicator == "unemployment" and (.series | length == 2)' "$smoke_body" >/dev/null
            grep -Eiq '^cache-control:[[:space:]]*no-store' "$smoke_headers"
            : > "$smoke_body"
            : > "$smoke_headers"
            curl --fail --silent --show-error --max-time 20 --dump-header "$smoke_headers" --output "$smoke_body" 'https://www.woori.today/portal-api/world-bank/compare?countries=kr%2Cus&indicator=population'
            jq -e '.source == "json" and .indicator == "population" and (.series | length == 2)' "$smoke_body" >/dev/null
            grep -Eiq '^cache-control:[[:space:]]*public, max-age=3600, stale-while-revalidate=86400' "$smoke_headers"
            : > "$smoke_body"
            : > "$smoke_headers"
            curl --fail --silent --show-error --max-time 20 --dump-header "$smoke_headers" --output "$smoke_body" 'https://www.woori.today/portal-api/finance/companies?pageSize=1'
            jq -e '.dataState == "available" and .pagination.total > 0 and (.data | length == 1)' "$smoke_body" >/dev/null
            grep -Eiq '^cache-control:[[:space:]]*no-store' "$smoke_headers"
            rm -f "$smoke_body" "$smoke_headers"
            smoke_body=""
            smoke_headers=""
            deploy_started=0
            echo "Portal deployed from commit ${RELEASE_SHA}; image digest ${PORTAL_DIGEST}; rollback tag ${rollback_tag} retained; World Bank DB/JSON source smoke tests passed."
            fi
            echo "Database operations: preflight=${PREFLIGHT_DATABASE}, migrations=${APPLY_MIGRATIONS}, world_bank=${IMPORT_WORLD_BANK}, sec=${IMPORT_SEC}; Portal deploy=${DEPLOY_PORTAL}."
